name: Pint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Install dependencies
        run: composer install --no-progress

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Install blade-formatter
        run: npm install -g blade-formatter

      - name: Run blade-formatter
        run: blade-formatter --check 'resources/**/*.blade.php'
